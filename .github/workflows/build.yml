name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # Pinned: macos-latest now carries Xcode 26 (macOS 26 SDK), which no longer ships
            # the AGL framework that the prebuilt Qt 6.8 still links ("ld: framework 'AGL'
            # not found"). The macOS 15 SDK still has it.
            os: macos-15
            script: ./scripts/build-mac.sh
            qt_arch: clang_64
          - name: Linux
            os: ubuntu-latest
            script: ./scripts/build-linux.sh
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        # 6.8+: Qt 6.7 still links the AGL framework, which the current macOS runners'
        # Xcode no longer ships ("ld: framework 'AGL' not found").
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: ${{ matrix.qt_arch }}
          # Multimedia is a separate module in the Qt installer; without it
          # find_package(Qt6 COMPONENTS Multimedia MultimediaWidgets) fails.
          modules: qtmultimedia
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # zipcmp / zipmerge / ziptool: libzip's CMake config references their binaries.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libzip-dev zipcmp zipmerge ziptool

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.script }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build-windows.ps1
